<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>🎯 NASDAQ Dashboard</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;padding:20px;color:#fff}.container{max-width:1400px;margin:0 auto;background:rgba(20,20,30,.95);border-radius:20px;padding:30px}.header{background:linear-gradient(135deg,#667eea,#764ba2);padding:30px;text-align:center;border-radius:15px;margin-bottom:20px}h1{font-size:32px;margin-bottom:10px}.live{color:#00ff87;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin:20px 0}.card{background:rgba(40,40,50,.6);border-radius:10px;padding:20px;border-left:3px solid #667eea}.label{font-size:13px;color:#888;margin-bottom:8px}.value{font-size:24px;font-weight:bold}.pos{color:#00ff87}.neg{color:#ff4757}.section{background:rgba(30,30,40,.8);border-radius:12px;padding:25px;margin:20px 0}h2{font-size:20px;color:#667eea;margin-bottom:15px}.check{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(40,40,50,.4);border-radius:8px;margin:8px 0}.box{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:bold}.box.hit{background:#00ff87;color:#000}.box.watch{background:#ffa502;color:#000}.count{text-align:center;padding:20px;background:linear-gradient(135deg,rgba(102,126,234,.2),rgba(118,75,162,.2));border-radius:12px;margin:20px 0}.num{font-size:48px;font-weight:bold;color:#667eea}.api{background:rgba(255,193,7,.1);border-left:4px solid #ffc107;padding:20px;border-radius:8px;margin:20px 0}input{width:100%;max-width:400px;padding:12px;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:16px;margin:10px 0}button{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:12px 25px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}</style></head>
<body><div class="container">
<div class="header"><h1>🎯 Your NASDAQ Trading Dashboard</h1><p class="live">🟢 LIVE • Auto-updates every 10 seconds</p></div>
<div class="api" id="apiBox"><h3>🔑 Enter API Key</h3><p style="margin:10px 0;color:#888">Get free: <a href="https://www.perplexity.ai/settings/api" target="_blank" style="color:#667eea">Click Here</a></p><input type="password" id="k" placeholder="pplx-..."><button onclick="s()">Start</button></div>
<div id="d" style="display:none">
<div class="grid" id="g"></div>
<div class="section"><h2>🕐 9 AM Open</h2><div class="card"><div class="label">Gap</div><div class="value" id="gap">--</div></div></div>
<div class="section"><h2>🎯 Confluences</h2><div id="c"></div><div class="count"><div class="num" id="n">0/8</div><div>HITS</div></div></div>
<div class="section"><h2>📊 Setup</h2><div class="grid"><div class="card"><div class="label">Entry</div><div class="value" id="e">--</div></div><div class="card"><div class="label">Stop</div><div class="value neg" id="sl">--</div></div><div class="card"><div class="label">Target</div><div class="value pos" id="tp">--</div></div><div class="card"><div class="label">R/R</div><div class="value" id="rr">--:1</div></div></div></div>
</div></div>
<script>let k=localStorage.getItem('k')||'';if(k){document.getElementById('apiBox').style.display='none';document.getElementById('d').style.display='block';f()}
function s(){k=document.getElementById('k').value.trim();if(k){localStorage.setItem('k',k);document.getElementById('apiBox').style.display='none';document.getElementById('d').style.display='block';f()}}
async function f(){try{const r=await fetch('https://api.perplexity.ai/finance/quotes',{method:'POST',headers:{'Authorization':'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({ticker_symbols:['QQQ','SPY','DIA','IWM'],fields:['price','changesPercentage','volume','dayLow','dayHigh','previousClose','open']})});const q=await r.json();d(q)}catch(e){console.log(e)}}
function d(q){const x=q[0];document.getElementById('g').innerHTML=q.map(i=>'<div class="card"><div class="label">'+i.symbol+'</div><div class="value '+(i.changesPercentage>=0?'pos':'neg')+'">$'+i.price.toFixed(2)+'<br><span style="font-size:16px">'+(i.changesPercentage>=0?'+':'')+i.changesPercentage.toFixed(2)+'%</span></div></div>').join('');
const g=((x.open-x.previousClose)/x.previousClose)*100;document.getElementById('gap').innerHTML='<span class="'+(g>0.5?'pos':g<-0.5?'neg':'')+'">'+(g>0.5?'UP':g<-0.5?'DOWN':'Flat')+' '+Math.abs(g).toFixed(2)+'%</span>';
const p=x.price,v=(x.dayLow+x.dayHigh+p)/3,c=[{n:'VWAP',h:p>v},{n:'Volume',h:x.volume>2e7},{n:'Level',h:p>(x.dayLow+x.dayHigh)/2},{n:'Structure',h:x.changesPercentage>-.5},{n:'Time',h:true},{n:'RSI',h:false,w:true},{n:'MA',h:false,w:true},{n:'Flow',h:false,w:true}];
document.getElementById('c').innerHTML=c.map(i=>'<div class="check"><div class="box '+(i.h?'hit':i.w?'watch':'')+'">'+(i.h?'✓':i.w?'⚠':'○')+'</div><div>'+i.n+'</div></div>').join('');
const h=c.filter(i=>i.h).length;document.getElementById('n').textContent=h+'/8';
const sl=p*.97,tp=p*1.04;document.getElementById('e').textContent='$'+p.toFixed(2);document.getElementById('sl').textContent='$'+sl.toFixed(2);document.getElementById('tp').textContent='$'+tp.toFixed(2);document.getElementById('rr').textContent=((tp-p)/(p-sl)).toFixed(2)+':1'}
setInterval(f,10000)</script>
</body></html>
